spring:
  application:
    name: digital-signature
  datasource:
    url: jdbc:h2:mem:digital_signature;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 5000
  servlet:
    context-path: /api

jwt:
  secret: ${JWT_SECRET:your_jwt_secret_key_here_change_in_production}
  expiration: 604800000

app:
  upload-dir: uploads/

logging:
  level:
    root: INFO
    com.digitalsignature: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
